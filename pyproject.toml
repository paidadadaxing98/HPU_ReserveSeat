[project]
name = "seat-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "fastapi>=0.110", "uvicorn>=0.29", "apscheduler>=3.10", "websockets>=12.0", "aiohttp>=3.9", "pyee>=11.0", "cryptography>=42.0", "wecom-aibot-sdk>=1.0.8,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
