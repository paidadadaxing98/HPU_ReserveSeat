[project]
name = "seat-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "fastapi>=0.110", "uvicorn>=0.29", "apscheduler>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
